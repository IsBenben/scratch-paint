name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@v4
      with:
        version: 10.33.0
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.18.0
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - run: pnpm run lint
    - run: pnpm run build
    - run: pnpm run test
